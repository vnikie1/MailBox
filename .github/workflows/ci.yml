name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # A Windows-only app: there is nothing to gain from an OS matrix here, and the DWM and
  # WM_NCHITTEST work in src-tauri/src/platform does not exist on any other target.
  #
  # Deliberately no global `RUSTFLAGS: -D warnings`: that applies to dependencies too, so
  # a warning in someone else's crate would fail our build. Denials belong on the clippy
  # invocation, where they only cover code we wrote.

jobs:
  frontend:
    name: Frontend
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: Stylelint (enforces standing rule 1 — no hardcoded design values)
        run: npm run lint:css

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end (shell in Chromium)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  core:
    name: Rust core
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # tauri::generate_context! embeds the built frontend, so the Rust crate cannot
      # compile until dist/ exists.
      - run: npm ci
      - run: npm run build

      - name: rustfmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    name: Installer
    runs-on: windows-latest
    needs: [frontend, core]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Proves the whole thing links and packages from a clean clone. Not code-signed here;
      # that is a Phase 11 concern (docs/05 §7).
      #
      # The throwaway updater key is not code signing. `bundle.createUpdaterArtifacts` is true in
      # the shipped config, because a release built without it produces no .sig and the updater
      # can then never offer that release -- a silent failure months later. The cost is that the
      # bundler refuses to build at all without a signing key, which is how this job started
      # failing the moment that setting was committed.
      #
      # The real key is not on CI and must never be. A key generated here signs the smoke-test
      # artifact with something that verifies against nothing, which is correct: nobody installs
      # this build, and the point is that the packaging path links and runs end to end.
      - name: Build installer
        shell: bash
        run: |
          npx tauri signer generate -w "$RUNNER_TEMP/updater-throwaway.key" -p "" --ci
          # The variable holds the key itself, not a path to it. TAURI_SIGNING_PRIVATE_KEY_PATH
          # is ignored without a word, which produces a build that succeeds and an update nobody
          # signed.
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/updater-throwaway.key")"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          npm run app:build

      - uses: actions/upload-artifact@v4
        with:
          name: halcyon-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
