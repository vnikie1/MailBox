<html><head><meta charset='utf-8'><style>
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
     color:#1d1d1f;line-height:1.5;margin:0;padding:24px;background:#f5f5f7}
.card{background:#fff;border-radius:12px;padding:24px;max-width:820px;margin:0 auto;
      box-shadow:0 1px 3px rgba(0,0,0,.08)}
h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:24px 0 8px;color:#6e6e73;
   text-transform:uppercase;letter-spacing:.04em}
table{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px}
th{text-align:left;padding:8px 10px;background:#f5f5f7;font-weight:600;font-size:12px;
   text-transform:uppercase;letter-spacing:.03em;color:#6e6e73}
td{padding:8px 10px;border-top:1px solid #ececec}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.sub{color:#6e6e73;font-size:13px}
.bar{display:inline-block;height:8px;background:#0071e3;border-radius:4px;vertical-align:middle}
</style></head><body><div class='card'><h1>Network daily report</h1><div class='sub'>Monday &middot; last 24 hours</div><h2>Totals</h2><p><strong>12,000</strong> queries &middot; <strong>2,040</strong> blocked (<strong>17.0%</strong>)</p><h2>Per device</h2><table><tr><th>Device</th><th>Name</th><th class='n'>Queries</th><th class='n'>Blocked</th><th></th></tr><tr><td>10.0.0.2</td><td class='sub'>laptop.example</td><td class='n'>6,000</td><td class='n'>120</td><td><span class='bar' style='width:120px'></span></td></tr><tr><td>10.0.0.3</td><td class='sub'>phone.example</td><td class='n'>4,000</td><td class='n'>1,600</td><td><span class='bar' style='width:80px'></span></td></tr><tr><td>10.0.0.4</td><td class='sub'>&mdash;</td><td class='n'>2,000</td><td class='n'>320</td><td><span class='bar' style='width:40px'></span></td></tr></table></div></body></html>
