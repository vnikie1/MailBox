[package]
name = "halcyon"
version = "1.0.0"
description = "A macOS-Mail-quality email client for Windows 11"
edition = "2021"
rust-version = "1.82"
publish = false
# Several binaries exist (the app and the dev tools), so `cargo run` and therefore
# `tauri dev` need to be told which one is the app.
default-run = "halcyon"

# Every file in src/bin/ is auto-discovered by cargo as a binary of this package, built into
# target/release by a release build, and then picked up by the NSIS bundler. That is how
# seed.exe and crashgate.exe came to be installed on a real machine: a clean install of 1.0.0
# put both of them in %LOCALAPPDATA%Halcyon, next to halcyon.exe.
#
# seed.exe writes fabricated mail into the database. crashgate.exe deliberately crashes the
# app. Neither is dangerous by itself, but neither has any business being shipped, and the
# comment that used to sit below asserted the opposite -- that Tauri bundles only the product
# binary. It does not, and nobody checked until an installed copy was listed file by file.
#
# With auto-discovery off, every binary is declared explicitly and the dev tools sit behind a
# feature that release builds do not enable, so they are never built and cannot be bundled.
autobins = false

[lib]
name = "halcyon_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

# ---------------------------------------------------------------- local store
# rusqlite "bundled" compiles SQLite from source rather than linking whatever the machine
# happens to have. docs/03 §3 needs FTS5 and WAL, and a bundled build is the only way to
# know they are there on every Windows box this ships to.
rusqlite = { version = "0.32", features = ["bundled", "backup", "functions", "limits"] }
r2d2 = "0.8"
r2d2_sqlite = "0.25"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util"] }

# Typed TS bindings generated from the Rust types, so the IPC contract in docs/03 §4
# cannot drift between the two halves.
ts-rs = { version = "10", features = ["serde-compat"] }

# ---------------------------------------------------------------- accounts and auth
# Secrets live in the Windows Credential Manager and nowhere else — docs/03 §7, standing
# rule 12. keyring's windows-native backend is DPAPI-backed and per-user at rest.
keyring = { version = "3", features = ["windows-native"] }

# OAuth is hand-rolled on top of these rather than pulled from a framework: PKCE is a hash
# and a redirect, and the loopback listener has to be ours anyway.
base64 = "0.22"
sha2 = "0.10"
rand = "0.8"
url = "2"

# native-tls throughout, which on Windows is SChannel — so certificate validation uses the
# system trust store the user's admin actually manages. docs/05 §6 requires validation on
# with no user-visible bypass for public hosts.
reqwest = { version = "0.12", features = ["json"] }
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
async-native-tls = { version = "0.5", default-features = false, features = ["runtime-tokio"] }
futures = "0.3"
hickory-resolver = "0.24"

# MIME and RFC 2047 decoding. Envelopes arrive from IMAP with encoded words in every
# human-readable field ("=?UTF-8?B?...?="), and a client that shows those raw is unusable
# for anyone whose correspondents do not write in ASCII. Also parses bodies in Phase 6.
mailparse = "0.16"
charset = "0.1"

# HTML sanitisation. docs/03 §6 names `ammonia` specifically, and it is the right call: it
# parses with html5ever rather than matching patterns, so it cannot be defeated by the
# malformed markup that defeats regex-based strippers — which is most of them.
ammonia = "4"

# This is a Windows application; the platform layer is not conditional.
windows = { version = "0.61", features = [
  "Foundation",
  "UI",
  "UI_ViewManagement",
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell_Common",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_System_ProcessStatus",
  "Win32_System_StationsAndDesktops",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
# MIME building and SMTP. Hand-rolling either is a bad trade: quoted-printable, RFC 2047
# header encoding, line folding and multipart boundaries are all places where "nearly right"
# renders as mojibake in someone else s client, and Outlook Windows — which docs/04 names as
# the strictest renderer — is the least forgiving of the lot.
#
# native-tls to match the IMAP side, so certificate validation goes through SChannel and the
# system trust store rather than a second, separately-configured root set.
lettre = { version = "0.11", default-features = false, features = [
  "builder",
  "tokio1",
  "tokio1-native-tls",
  "smtp-transport",
  "hostname",
] }
# Only for formatting the attribution line above a quoted reply. Apple Mail's exact shape is
# "On 27 Aug 2026, at 09:34, Ada <ada@x> wrote:", which needs a local-time conversion and a
# month name — the two parts of date handling that are genuinely not worth writing by hand.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
pdf-extract = "0.12.0"
zip = "5.0.1"
lopdf = "0.36.0"
tauri-plugin-notification = "2.3.3"

# Toast buttons. The Tauri plugin wraps this crate but exposes only `action_type_id`, which is
# the mobile notion of an action; `add_button` — the thing Windows actually draws on a toast —
# is not reachable through it. docs/06 asks for Reply / Archive / Mark as Read on the toast, so
# the Windows path talks to the crate directly.
tauri-winrt-notification = "0.7.3"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-updater = { version = "2", optional = true }
# Outlook .pst import. A clean-room MS-PST implementation published by Microsoft: it reads the
# object store — the B-trees, the heap, the property and table contexts — and hands back MAPI
# properties. Turning those into a message is ours; see transfer::pst for why that is the
# harder half.
outlook-pst = "1.2"


[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
proptest = "1.9.0"
tempfile = "3"

[[bin]]
name = "halcyon"
path = "src/main.rs"

# The development tools. required-features is what keeps them out of a release: without
# --features devtools cargo does not build them at all, so there is nothing in target/release
# for the bundler to find.
#
#   cargo run --features devtools --bin seed

[[bin]]
name = "seed"
path = "src/bin/seed.rs"
required-features = ["devtools"]

[[bin]]
name = "crashgate"
path = "src/bin/crashgate.rs"
required-features = ["devtools"]

[[bin]]
name = "junkgate"
path = "src/bin/junkgate.rs"
required-features = ["devtools"]

[[bin]]
name = "searchgate"
path = "src/bin/searchgate.rs"
required-features = ["devtools"]

[[bin]]
name = "unseed"
path = "src/bin/unseed.rs"
required-features = ["devtools"]

[features]
# Store builds turn the updater off. The Microsoft Store installs updates itself, and two
# update mechanisms fighting produces duplicate installs and fails certification — docs/07
# §2.3. Build the Store package with `--no-default-features --features store`.
default = ["self-update"]
self-update = ["dep:tauri-plugin-updater"]
store = []

# The tools in src/bin/. Off by default so a release build does not produce them, and
# therefore cannot ship them -- see the note on autobins above.
devtools = []

# The twelve-hour soak. Behind a feature so an ordinary `cargo test` does not try to *link* it
# — while a soak is running, its own binary is locked and the linker fails with LNK1104, which
# stops `npm run verify` for a reason that has nothing to do with the change being verified.
#
#   cargo test --features soak --test dovecot_soak -- --ignored --nocapture
soak = []

[[test]]
name = "dovecot_soak"
required-features = ["soak"]
