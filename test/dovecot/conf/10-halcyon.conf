# Dovecot configuration for the Phase 5 exit gate. docs/04 §Phase 5.
#
# Deliberately close to what a real provider offers, because the point of testing against
# Dovecot is to exercise the paths Gmail does not: QRESYNC (which Gmail lacks entirely), a
# UIDVALIDITY reset we can actually cause, and a server we are allowed to disconnect rudely.

protocols = imap

# CONDSTORE and QRESYNC. Gmail advertises the first and not the second, so this is the only
# place the QRESYNC path gets run at all.
mail_plugins = $mail_plugins notify replication

ssl = required
ssl_cert = </etc/dovecot/certs/server.crt
ssl_key = </etc/dovecot/certs/server.key
ssl_min_protocol = TLSv1.2

# A flat passwd-file. The gate needs one user, not a directory.
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users/passwd
}
userdb {
  driver = static
  args = uid=1000 gid=1000 home=/srv/mail/%u
}

mail_location = maildir:/srv/mail/%u/Maildir

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts { special_use = \Drafts auto = subscribe }
  mailbox Sent   { special_use = \Sent   auto = subscribe }
  mailbox Junk   { special_use = \Junk   auto = subscribe }
  mailbox Trash  { special_use = \Trash  auto = subscribe }
  mailbox Archive { special_use = \Archive auto = subscribe }
}

# Generous, because the soak test deliberately opens and holds connections. The default of 10
# would make the test fail for a reason that is not the thing being tested.
mail_max_userip_connections = 50

# IDLE keepalive. Shorter than the RFC's 29 minutes so a twelve-hour soak actually exercises
# the re-issue path many times rather than twice.
imap_idle_notify_interval = 2 mins

service imap-login {
  inet_listener imap  { port = 143 }
  inet_listener imaps { port = 993 ssl = yes }
}

# Plaintext auth is refused on the unencrypted port, which is what Halcyon expects to find.
disable_plaintext_auth = yes
auth_mechanisms = plain login

log_path = /dev/stderr
info_log_path = /dev/stderr
