# Dovecot configuration for the Phase 5 exit gate. docs/04 §Phase 5.
#
# Deliberately close to what a real provider offers, because the point of testing against
# Dovecot is to exercise the paths Gmail does not: QRESYNC (which Gmail lacks entirely), a
# UIDVALIDITY reset we can actually cause, and a server we are allowed to disconnect rudely.
#
# This is the whole configuration — the image deletes Alpine's `conf.d`, because example files
# set most of these keys again and the last value read wins. One file that reads top to bottom
# is worth more here than the distribution's layout.
#
# **Dovecot 2.4 syntax**, which is not 2.3's. The version declarations below are mandatory and
# must come first; `passdb`/`userdb` take a driver name on the block rather than a `driver`
# setting inside it; `mail_location` is now `mail_driver` plus `mail_path`; and `%u` is now
# `%{user}`. A 2.3 config does not fail gracefully on 2.4 — it refuses to start.
dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols = imap
listen = *

# ---------------------------------------------------------------------------- TLS
#
# Required, not offered. Halcyon refuses a plaintext IMAP port outright (docs/05 §6), so a
# server without this would only ever exercise the refusal path.
ssl = required
ssl_server_cert_file = /etc/dovecot/certs/server.crt
ssl_server_key_file = /etc/dovecot/certs/server.key
ssl_min_protocol = TLSv1.2

auth_allow_cleartext = no
auth_mechanisms = plain login
auth_verbose = yes

# ---------------------------------------------------------------------------- accounts
#
# A flat passwd-file. The gate needs one user, not a directory.
passdb passwd-file {
  passwd_file_path = /etc/dovecot/users/passwd
  default_password_scheme = PLAIN
}

userdb static {
  fields {
    uid = 1000
    gid = 1000
    home = /srv/mail/%{user}
  }
}

mail_driver = maildir
mail_path = /srv/mail/%{user}/Maildir
mail_uid = 1000
mail_gid = 1000

namespace inbox {
  inbox = yes
  separator = /

  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \Archive
    auto = subscribe
  }
}

# ---------------------------------------------------------------------------- the gate
#
# Generous, because the soak test deliberately opens and holds connections. The default of 10
# would make the test fail for a reason that is not the thing being measured.
mail_max_userip_connections = 50

# Shorter than RFC 2177's 29 minutes so a twelve-hour soak exercises the IDLE re-issue path
# many times over rather than twice.
imap_idle_notify_interval = 2 mins

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

# Everything to stderr, so `docker compose logs` is the whole story. The soak test counts
# connections from these lines, which is how "no connection storm" gets measured rather than
# asserted.
log_path = /dev/stderr
info_log_path = /dev/stderr
